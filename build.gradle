plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sportsbooking'
version = '0.0.1-SNAPSHOT'
description = 'sportsbooking-mainapi'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // Spring Web (MVC)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    // OpenApi (Swagger)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Mybatis (queries complejas con XML mappers)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'

    // PostGIS / Hibernate Spatial (búsqueda geoespacial)
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.locationtech.jts:jts-core:1.20.0'

    // Redis (ban list de tokens)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Cache
//    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // JWT (jjwt 0.12.6)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    testCompileOnly 'org.projectlombok:lombok:1.18.32'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'

    // Firebase Admin SDK (FCM push notifications)
    implementation 'com.google.firebase:firebase-admin:9.8.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Google API Client for Google OAuth Token Verification
    implementation 'com.google.api-client:google-api-client:2.6.0'

    // Other...
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// tasks.withType(JavaCompile).configureEach {
//     options.compilerArgs << "-parameters"
// } 
tasks.withType(JavaCompile) {
    options.compilerArgs += "-parameters"
}